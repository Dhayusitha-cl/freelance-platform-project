<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freelance Platform - Post a Job</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <section class="job-post-card">

            <h1>Post a Job</h1>

            <p class="subtitle">
                Tell freelancers what you need help with.
            </p>

            <form id="jobPostForm">

                <div class="form-group">
                    <label for="jobTitle">Job Title</label>

                    <input
                        type="text"
                        id="jobTitle"
                        name="jobTitle"
                        placeholder="Enter your job title"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="jobDescription">Job Description</label>

                    <textarea
                        id="jobDescription"
                        name="jobDescription"
                        rows="6"
                        placeholder="Describe the work you need completed"
                        required
                    ></textarea>
                </div>

                <div class="form-group">
                    <label for="budget">Budget</label>

                    <input
                        type="number"
                        id="budget"
                        name="budget"
                        placeholder="Enter your budget"
                        min="0"
                        step="0.01"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="deadline">Deadline</label>

                    <input
                        type="date"
                        id="deadline"
                        name="deadline"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="category">Category</label>

                    <select id="category" name="category" required>
                        <option value="">Select a category</option>
                        <option value="web-development">Web Development</option>
                        <option value="mobile-development">Mobile Development</option>
                        <option value="design">Design</option>
                        <option value="writing">Writing</option>
                        <option value="marketing">Marketing</option>
                        <option value="data">Data</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="skills">Required Skills</label>

                    <input
                        type="text"
                        id="skills"
                        name="skills"
                        placeholder="Example: HTML, CSS, JavaScript"
                    >
                </div>

                <p id="jobPostMessage" class="message"></p>

                <button type="submit">
                    Post Job
                </button>

            </form>

        </section>

    </main>

    <script src="job-post.js"></script>

</body>
</html>
